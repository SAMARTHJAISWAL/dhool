[package]
name = "dhool-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Falling-sand cellular automaton core for dhool, compiled to WebAssembly"
repository = "https://github.com/SAMARTHJAISWAL/dhool"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
# Grid code reads best with x, y, i, j, w, h.
many_single_char_names = "allow"
similar_names = "allow"
